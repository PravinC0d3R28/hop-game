<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HOP — ball lab</title>
    <style>
      html, body { margin: 0; background: #141414; color: #f4efe6; }
      body { font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
      #hud { display: flex; gap: 8px; align-items: center; padding: 10px 14px 0; }
      #hud b { font-size: 16px; }
      #hud button, #hud select {
        font: inherit; color: #f4efe6; background: #2a2a2a;
        border: 1px solid #4a4a4a; border-radius: 6px; padding: 4px 10px;
      }
      #hud select { min-width: 180px; }
      #hud button { cursor: pointer; }
      #row, #phone-row { display: flex; gap: 10px; padding: 10px 14px; align-items: flex-start; }
      .cell { position: relative; background: #000; }
      .cell canvas { display: block; width: 100%; height: 100%; }
      .cell span {
        position: absolute; left: 8px; top: 6px;
        font-size: 12px; letter-spacing: 0.04em;
        color: #fff; text-shadow: 0 1px 2px #000;
      }
      .desk { width: 480px; height: 270px; }
      .phone { width: 195px; height: 422px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <button type="button" id="prev">Prev</button>
      <select id="skin"></select>
      <button type="button" id="next">Next</button>
      <b id="title">ball</b>
    </div>
    <div id="row"></div>
    <div id="phone-row"></div>
    <script type="module" src="/src/dev/ballLab.ts"></script>
  </body>
</html>
