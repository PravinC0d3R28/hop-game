<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HOP — void structure lab</title>
    <style>
      html, body { margin: 0; background: #ffffff; color: #1a2438; }
      body.single { height: 100%; overflow: hidden; }
      canvas { display: block; }
      #name {
        position: fixed; left: 12px; top: 10px; z-index: 2;
        font: 14px/1.4 ui-monospace, monospace;
      }
      #sheet { padding: 8px 22px 48px; max-width: 1480px; }
      h2 {
        margin: 28px 0 12px;
        font: 600 12px/1 ui-monospace, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #3d5270;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }
      .card {
        margin: 0;
        background: #ffffff;
        border: 1px solid #d5deea;
      }
      .card img { width: 100%; height: 210px; object-fit: contain; display: block; }
      figcaption {
        padding: 8px 10px 10px;
        font: 13px/1.3 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="name"></div>
    <div id="sheet"></div>
    <script type="module" src="/src/dev/voidLab.ts"></script>
  </body>
</html>
